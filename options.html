<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 视频章节 · 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <header>
      <div class="eyebrow">VIDEO AI CHAPTERS</div>
      <h1>模型与转写设置</h1>
      <p>打开 B 站或 YouTube 视频时，扩展会优先读取字幕；无字幕时可以使用本地语音转写服务。</p>
    </header>

    <form id="settings-form">
      <label>
        <span>模型服务</span>
        <select id="provider">
          <option value="glm-cn">智谱 GLM-4.7-Flash（国内）</option>
          <option value="qwen-cn">阿里云百炼 Qwen3.5-35B-A3B（北京）</option>
          <option value="deepseek">DeepSeek</option>
          <option value="glm-global">Z.AI GLM（国际）</option>
          <option value="custom">其他兼容 Chat Completions 的接口</option>
        </select>
      </label>
      <label>
        <span>Chat Completions 请求地址</span>
        <input id="endpoint" type="url" spellcheck="false" autocomplete="off" required>
      </label>
      <p>千问预设使用北京地域 DashScope 兼容地址；也可将地址改为百炼业务空间专属域名。</p>
      <label>
        <span>模型名称</span>
        <input id="model" type="text" spellcheck="false" autocomplete="off" required>
      </label>
      <label>
        <span>API Key</span>
        <input id="api-key" type="password" spellcheck="false" autocomplete="off" required>
      </label>

      <div class="checks">
        <label class="check"><input id="auto-analyze" type="checkbox" checked> 打开视频时自动总结（可能产生 API 费用）</label>
        <label class="check"><input id="local-asr" type="checkbox" checked> 无字幕时尝试本地语音转写</label>
        <label class="check"><input id="json-mode" type="checkbox" checked> 请求模型使用 JSON 输出模式</label>
      </div>

      <div class="actions">
        <button type="submit" id="save">保存设置</button>
        <button type="button" id="test" class="secondary">测试模型连接</button>
      </div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </form>

    <section class="hint">
      <h2>无字幕视频</h2>
      <p>本地转写需要先运行项目中的 <code>helper</code>。它在你的电脑上下载视频音轨并转写，长视频首次处理可能需要较长时间。扩展会在无法连接时明确提示。</p>
      <p>API Key 保存在本机的扩展存储中；浏览器扩展存储不加密。字幕和摘要会发给你配置的模型服务。</p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
